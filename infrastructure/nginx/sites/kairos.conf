### KAIROS DB — public vhosts
###
###   cloud.example.com     → dashboard (Next.js)
###   api.example.com       → API (Fastify)
###   realtime.example.com  → WebSocket
###   files.example.com     → storage (large uploads)
###
### Replace example.com with your domain before enabling TLS.

## ---------------------------------------------------------------------
## Redirect all plain HTTP to HTTPS, except the ACME challenge.
## ---------------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

## ---------------------------------------------------------------------
## Catch-all for HTTPS requests to unknown hostnames.
## Answering these would tell a scanner that something is here.
## ---------------------------------------------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    return 444;                 # close the connection without a response
}

## ---------------------------------------------------------------------
## DASHBOARD — cloud.example.com
## ---------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cloud.example.com;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_req  zone=kairos_general burst=60 nodelay;
    limit_conn kairos_conn 40;

    if ($kairos_blocked_agent) { return 403; }

    # Next.js build output is immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://kairos_dashboard;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://kairos_dashboard;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}

## ---------------------------------------------------------------------
## API — api.example.com
## ---------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.example.com;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn kairos_conn 60;
    client_max_body_size 5m;          # JSON bodies only; uploads go to files.

    if ($kairos_blocked_agent) { return 403; }

    ## Auth endpoints get their own bucket. One request per second, with a
    ## small burst, is plenty for a human and useless for a credential stuffer.
    ## fail2ban picks up whatever survives this.
    location ~ ^/api/v1/auth/(login|signup|password/(forgot|reset))$ {
        limit_req zone=kairos_auth burst=5 nodelay;
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    ## The SQL runner can legitimately take a while.
    location = /api/v1/sql {
        limit_req zone=kairos_api burst=10 nodelay;
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 120s;
    }

    ## Health probes should never be rate limited or logged.
    location ~ ^/api/(health|ready)$ {
        access_log off;
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req zone=kairos_api burst=40 nodelay;
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}

## ---------------------------------------------------------------------
## REALTIME — realtime.example.com
## Long-lived WebSocket connections. Buffering and short read timeouts
## both break them, so this vhost turns them off.
## ---------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name realtime.example.com;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn kairos_conn 100;

    location /realtime/v1 {
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering     off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / { return 404; }
}

## ---------------------------------------------------------------------
## STORAGE — files.example.com
## The only vhost that accepts large bodies.
## ---------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name files.example.com;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn kairos_conn 30;

    client_max_body_size    1g;
    client_body_timeout     300s;
    proxy_request_buffering off;       # stream straight through to the API

    if ($kairos_blocked_agent) { return 403; }

    ## Public bucket reads. Cacheable, cheap, no auth.
    location /storage/v1/public/ {
        limit_req zone=kairos_general burst=100 nodelay;
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        limit_req zone=kairos_upload burst=20 nodelay;
        proxy_pass http://kairos_api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
