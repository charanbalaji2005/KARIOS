### KAIROS DB — main nginx configuration
### Public gateway. Terminates TLS, enforces limits, proxies to the internal network.
### Nothing behind this file is reachable from the internet without passing through it.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ## ---------------------------------------------------------------
    ## Logging
    ## The `kairos` format is what fail2ban parses. Keep $remote_addr
    ## first and $status where the filters expect it, or the jails break.
    ## ---------------------------------------------------------------
    log_format kairos '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'urt="$upstream_response_time" host="$host"';

    access_log /var/log/nginx/access.log kairos buffer=32k flush=5s;

    ## ---------------------------------------------------------------
    ## Core tuning
    ## ---------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 2048;
    server_tokens       off;              # do not advertise the nginx version

    keepalive_timeout   65s;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout        60s;
    reset_timedout_connection on;

    ## Request size ceilings. Uploads go to the storage vhost, which raises this.
    client_max_body_size      2m;
    client_body_buffer_size   128k;
    large_client_header_buffers 4 16k;

    ## ---------------------------------------------------------------
    ## Real client IP
    ## Behind Cloudflare, $remote_addr is Cloudflare's edge unless we
    ## restore it. Without this, fail2ban would ban Cloudflare itself.
    ## ---------------------------------------------------------------
    include /etc/nginx/snippets/cloudflare-realip.conf;

    ## ---------------------------------------------------------------
    ## Rate limiting — server protection.
    ## This is the coarse layer. Per-user and per-API-key limits live in
    ## the application (Redis), because nginx only sees IPs.
    ## ---------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=kairos_general:16m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=kairos_api:16m     rate=15r/s;
    limit_req_zone  $binary_remote_addr zone=kairos_auth:8m     rate=1r/s;
    limit_req_zone  $binary_remote_addr zone=kairos_upload:8m   rate=5r/s;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=kairos_conn:16m;
    limit_conn_status 429;

    ## ---------------------------------------------------------------
    ## Compression
    ## ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml application/wasm;

    ## ---------------------------------------------------------------
    ## WebSocket upgrade mapping (used by the realtime vhost)
    ## ---------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ## Flag requests that look like scanners so we can drop them cheaply.
    map $http_user_agent $kairos_blocked_agent {
        default                 0;
        ''                      1;
        '~*(nikto|sqlmap|nmap|masscan|zgrab|dirbuster|wpscan)'  1;
    }

    ## ---------------------------------------------------------------
    ## Upstreams — these hostnames resolve on the Docker internal network.
    ## They are NOT published to the host. Only nginx can reach them.
    ## ---------------------------------------------------------------
    upstream kairos_dashboard {
        server dashboard:3000;
        keepalive 32;
    }

    upstream kairos_api_backend {
        server api:4000;
        keepalive 64;
    }

    include /etc/nginx/sites/*.conf;
}
