### Response headers applied to every public vhost.
### The API sets its own via helmet; these are the belt to that's braces,
### and they also cover static assets nginx serves directly.

add_header X-Content-Type-Options    "nosniff"                    always;
add_header X-Frame-Options           "SAMEORIGIN"                 always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"               always;
add_header X-XSS-Protection          "0"                          always;

# HSTS. Only enable once TLS is confirmed working on every subdomain,
# otherwise you lock yourself out of plain HTTP for max-age seconds.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Never let a proxy or browser cache an authenticated API response.
add_header Cache-Control "no-store" always;
