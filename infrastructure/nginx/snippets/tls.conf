### TLS configuration.
### Certificates come from Let's Encrypt (certbot) or Cloudflare Origin CA.
### If you front the laptop with a Cloudflare Tunnel, the tunnel terminates
### TLS at the edge and you can serve plain HTTP on the loopback instead.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache         shared:KairosTLS:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout          5s;

ssl_certificate           /etc/nginx/certs/fullchain.pem;
ssl_certificate_key       /etc/nginx/certs/privkey.pem;
