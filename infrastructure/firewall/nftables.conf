#!/usr/sbin/nft -f
###############################################################################
# KAIROS DB — nftables ruleset
#
#   sudo cp nftables.conf /etc/nftables.conf
#   sudo systemctl enable --now nftables
#
# Use this INSTEAD of UFW, not alongside it. Running both produces rules that
# are difficult to reason about and even harder to debug at 2am.
###############################################################################

flush ruleset

table inet kairos {

    # Cloudflare edge ranges. Refresh with scripts/update-cloudflare-ips.sh
    set cloudflare_v4 {
        type ipv4_addr
        flags interval
        elements = {
            173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22,
            103.31.4.0/22,   141.101.64.0/18, 108.162.192.0/18,
            190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22,
            198.41.128.0/17, 162.158.0.0/15,  104.16.0.0/13,
            104.24.0.0/14,   172.64.0.0/13,   131.0.72.0/22
        }
    }

    # Networks trusted for administration. Adjust to your LAN / VPN.
    set admin_v4 {
        type ipv4_addr
        flags interval
        elements = { 192.168.0.0/16, 10.0.0.0/8 }
    }

    # Populated by fail2ban via the nftables action.
    set banned_v4 {
        type ipv4_addr
        flags timeout
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ip saddr @banned_v4 counter drop

        iif lo accept
        ct state established,related accept
        ct state invalid counter drop

        # ICMP, rate limited. Dropping it entirely breaks path MTU discovery.
        ip  protocol icmp   icmp  type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Public web. Connection rate capped per source address.
        tcp dport { 80, 443 } ct state new \
            meter kairos_web { ip saddr limit rate 60/second burst 120 packets } accept

        # SSH from admin networks only, with a slow-drip limit.
        ip saddr @admin_v4 tcp dport 22 ct state new \
            meter kairos_ssh { ip saddr limit rate 4/minute burst 8 packets } accept

        # Data plane is never accepted from anywhere. Logged so you notice probes.
        tcp dport { 5432, 6379, 9000, 9001 } \
            limit rate 5/minute log prefix "kairos-dataplane-probe " counter drop

        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        # Docker manages its own forwarding; if you use Docker, keep this
        # policy at accept instead and rely on docker-user.sh.
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
