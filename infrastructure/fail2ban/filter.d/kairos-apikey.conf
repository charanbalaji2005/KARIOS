# Fail2Ban filter — Kairos invalid API key usage
#
#   2026-09-21T18:04:11.204Z event=INVALID_API_KEY ip=203.0.113.9 user=- \
#     project=- agent="-" detail="prefix=krs_anon_ab"

[INCLUDES]
before = common.conf

[Definition]

failregex = ^\s*\S+ event=INVALID_API_KEY ip=<HOST>\s

ignoreregex =

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S\.%%f
