# Fail2Ban filter — Kairos authentication failures
#
# Matches lines written by services/api/src/lib/security-log.ts, e.g.
#
#   2026-09-21T18:04:11.204Z event=AUTH_FAILURE ip=203.0.113.9 user=- \
#     project=- agent="curl/8.4.0" detail="login"
#
# Verify with:
#   fail2ban-regex /var/log/kairos/security.log \
#                  /etc/fail2ban/filter.d/kairos-auth.conf

[INCLUDES]
before = common.conf

[Definition]

failregex = ^\s*\S+ event=AUTH_FAILURE ip=<HOST>\s
            ^\s*\S+ event=AUTH_LOCKOUT ip=<HOST>\s

ignoreregex =

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S\.%%f
