
[INCLUDES]
before = common.conf

[Definition]

failregex = ^\s*\S+ event=PATH_TRAVERSAL ip=<HOST>\s
            ^\s*\S+ event=SQL_IDENTIFIER_REJECTED ip=<HOST>\s
            ^\s*\S+ event=DESTRUCTIVE_STATEMENT_BLOCKED ip=<HOST>\s
            ^\s*\S+ event=TOKEN_REUSE ip=<HOST>\s
            ^\s*\S+ event=FORBIDDEN ip=<HOST>\s

ignoreregex =

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S\.%%f
