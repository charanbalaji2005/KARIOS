# Fail2Ban filter — vulnerability scanners and path fishing
#
# Kairos serves a Next.js dashboard and a JSON API. There is no PHP, no
# WordPress, no phpMyAdmin and no .env served over HTTP. Any request for one
# of these is a scanner, so a couple of hits is enough to ban.
#
# Access log format is the `kairos` format defined in nginx.conf:
#   203.0.113.9 - - [21/Sep/2026:18:04:11 +0000] "GET /.env HTTP/1.1" 404 ...

[Definition]

failregex = ^<HOST> .* "(GET|POST|HEAD)[^"]*(/\.env|/\.git|/wp-admin|/wp-login|/wp-content|/xmlrpc\.php|/phpmyadmin|/pma/|/admin\.php|/vendor/phpunit|/\.aws|/\.ssh|/config\.json|/backup\.sql|/dump\.sql|/\.DS_Store)[^"]*" .*$
            ^<HOST> .* "[^"]*" 4(01|03|04) .*"(?:-|[^"]*(?:nikto|sqlmap|nmap|masscan|zgrab|dirbuster|wpscan|python-requests/\d)[^"]*)"$
            ^<HOST> .* "-" 400 .*$

ignoreregex = ^<HOST> .* "(GET|HEAD) /(api/(health|ready)|favicon\.ico|robots\.txt|_next/)[^"]*" .*$

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
