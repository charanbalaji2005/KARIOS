# Fail2Ban filter — clients repeatedly tripping nginx rate limits
#
# nginx error.log lines look like:
#   2026/09/21 18:04:11 [error] 31#31: *1234 limiting requests, excess: 5.320
#   by zone "kairos_auth", client: 203.0.113.9, server: api.example.com, ...

[Definition]

failregex = ^.*\[error\].*limiting requests, excess:.*by zone "kairos_\w+", client: <HOST>
            ^.*\[error\].*limiting connections by zone "kairos_\w+", client: <HOST>

ignoreregex =

datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
